repository = "EmpneonCore"
include = [
  ".gitattributes",
  ".gitignore",
  ".github/ISSUE_TEMPLATE/**",
  ".github/PULL_REQUEST_TEMPLATE.md",
  ".github/workflows/ci.yml",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "CORE-README.md",
  "LICENSE",
  "MANIFEST.in",
  "pyproject.toml",
  "docs/adapter-development.md",
  "docs/api.md",
  "docs/benchmark-results.md",
  "docs/innovations.md",
  "docs/vision.md",
  "godot/**",
  "output/**",
  "scenarios/**",
  "src/**",
  "tests/**",
]

exclude = [
  "tests/unit/test_sims4_backend.py",
  "tests/unit/test_sims4_mod_autonomy.py",
]

[rename]
"CORE-README.md" = "README.md"
