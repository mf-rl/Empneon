name: Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install projects
        run: pip install -e "core[dev]" -e "adapters/thesims4[dev]" -e "adapters/godot[dev]"
      - name: Lint
        run: ruff check core/src core/tests adapters/thesims4/src adapters/thesims4/tests adapters/godot/src adapters/godot/tests tests
      - name: Type check
        run: mypy core/src adapters/thesims4/src adapters/godot/src
      - name: Test Core
        run: pytest
        working-directory: core
      - name: Test The Sims 4 adapter
        run: pytest
        working-directory: adapters/thesims4
      - name: Test Godot adapter
        run: pytest
        working-directory: adapters/godot
      - name: Test cross-adapter contracts
        run: pytest tests
      - name: Scenario regressions
        run: empneon-regress core/scenarios/clod1-regressions.json
      - name: Build Core
        run: python -m build
        working-directory: core
      - name: Build The Sims 4 adapter
        run: python -m build
        working-directory: adapters/thesims4
      - name: Build Godot adapter
        run: python -m build
        working-directory: adapters/godot
