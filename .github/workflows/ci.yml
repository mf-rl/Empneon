name: Monorepo CI

on:
  push:
    branches: [main, refactor]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install projects
        run: pip install -e "core[dev]" -e "thesims4[dev]" -e "godot[dev]"
      - name: Lint
        run: ruff check core/src core/tests thesims4/src thesims4/tests godot/src godot/tests tests scripts
      - name: Type check
        run: mypy core/src thesims4/src godot/src
      - name: Test Core
        run: pytest
        working-directory: core
      - name: Test The Sims 4 adapter
        run: pytest
        working-directory: thesims4
      - name: Test Godot adapter
        run: pytest
        working-directory: godot
      - name: Test cross-adapter contracts
        run: pytest tests
      - name: Scenario regressions
        run: empneon-regress core/scenarios/clod1-regressions.json
      - name: Validate publication snapshots
        run: python scripts/test_export_products.py
      - name: Build Core
        run: python -m build
        working-directory: core
      - name: Build The Sims 4 adapter
        run: python -m build
        working-directory: thesims4
      - name: Build Godot adapter
        run: python -m build
        working-directory: godot
