# Applies to repo-root tests/ and scripts/. Packages (core, adapters) use their own pyproject.toml;
# the nearest configuration wins per file.
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S603", "S608"]
"scripts/test_*.py" = ["S101", "S105", "S603", "S608"]
