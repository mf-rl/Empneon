sonar.projectKey=Empneon
sonar.projectName=Empneon
sonar.sourceEncoding=UTF-8

# Core targets 3.11+; the Sims 4 adapter backend targets 3.11+ but its ts4script
# mod (adapters/thesims4/ts4script) is compiled with Python 3.7 for the game runtime.
sonar.python.version=3.7,3.11,3.12

sonar.sources=core/src,adapters/godot/src,adapters/thesims4/src,adapters/thesims4/backend,adapters/thesims4/scripts,adapters/thesims4/ts4script,scripts
sonar.tests=core/tests,adapters/godot/tests,adapters/thesims4/tests,tests

sonar.exclusions=**/output/**,**/__pycache__/**,**/*.egg-info/**,**/.venv/**,adapters/thesims4/tuning/**,assets/**

sonar.python.coverage.reportPaths=core/coverage.xml,adapters/godot/coverage.xml,adapters/thesims4/coverage.xml,coverage-cross.xml,coverage-scripts.xml
